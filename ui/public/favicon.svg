<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deschil-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="nm-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Outer neumorphic base circle -->
  <circle cx="60" cy="60" r="56" fill="#1a1a2e"/>
  <circle cx="60" cy="60" r="56" fill="url(#nm-light)" opacity="0.5"/>
  <!-- D-letter mark -->
  <path d="M34 30 L34 90 L58 90 C80 90 88 76 88 60 C88 44 80 30 58 30 Z"
    fill="url(#deschil-gradient)" filter="url(#glow)"/>
  <!-- Inner cutout -->
  <path d="M44 40 L44 80 L56 80 C72 80 78 72 78 60 C78 48 72 40 56 40 Z"
    fill="#1a1a2e"/>
  <!-- Accent dot -->
  <circle cx="60" cy="60" r="6" fill="url(#deschil-gradient)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Highlight rim -->
  <circle cx="60" cy="60" r="55" stroke="url(#deschil-gradient)" stroke-width="1.5" opacity="0.4"/>
</svg>
